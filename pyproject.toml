[project]
name = "adversarial-prompt-guard"
version = "0.1.0"
description = "A provenance-aware dataset and hybrid detector for adversarial prompts."
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "fastapi>=0.115",
    "huggingface-hub>=0.25",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "ftfy>=6.2",
    "torch>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
prompt-guard-data = "prompt_guard.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
